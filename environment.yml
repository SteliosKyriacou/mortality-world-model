# Conda environment for mortality-world-model.
# Create:  conda env create -f environment.yml && conda run -n mwm pip install -e .
# torch is the CUDA 12.4 wheel (works with driver CUDA 12.6).
name: mwm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      - torchsde==0.2.6
      - torchdiffeq==0.2.5
      - pot==0.9.7.post1
      - lifelines==0.30.3
      - scikit-survival==0.28.0
      - pandas==2.3.3
      - pyarrow==25.0.1
      - numpy==2.4.6
      - scipy==1.17.1
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - pytest==9.1.1
      - pyyaml==6.0.3
      - gseapy==1.3.1
      - torch_geometric==2.8.0.post1
